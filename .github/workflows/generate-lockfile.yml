name: Generate Lockfile

on:
  push:
    branches:
      - issue-24-lockfile

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Switch test workflow to npm ci
        run: sed -i 's/npm install --no-audit --no-fund/npm ci --no-audit --no-fund/' .github/workflows/test.yml
      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json .github/workflows/test.yml; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/test.yml
          git commit -m "Fix #24: lock dependencies and use npm ci"
          git push origin HEAD:issue-24-lockfile
